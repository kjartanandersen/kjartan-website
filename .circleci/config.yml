version: 2.1

jobs:
  test-app:
    working_directory: ~/repo
    docker:
      - image: cimg/node:20.19.4

    steps:
      - checkout

      # The cimg image ships Yarn 1; corepack activates the Yarn 4 version
      # pinned in package.json's "packageManager" field.
      - run:
          name: Enable Corepack (Yarn 4)
          command: sudo corepack enable

      - restore_cache:
          keys:
            - yarn-cache-v1-{{ checksum "yarn.lock" }}
            - yarn-cache-v1-

      - run:
          name: Install dependencies
          command: yarn install --immutable

      - save_cache:
          key: yarn-cache-v1-{{ checksum "yarn.lock" }}
          paths:
            - .yarn/cache

      - run:
          name: Jest tests
          command: yarn test

  build-and-deploy-app:
    working_directory: ~/repo
    docker:
      - image: cimg/node:20.19.4

    steps:
      - checkout

      - run:
          name: Enable Corepack (Yarn 4)
          command: sudo corepack enable

      - restore_cache:
          keys:
            - yarn-cache-v1-{{ checksum "yarn.lock" }}
            - yarn-cache-v1-

      - run:
          name: Install dependencies
          command: yarn install --immutable

      - run:
          name: Build React app
          command: yarn build:prod

      - run:
          name: Deploy to Netlify
          command: yarn netlify:deploy

workflows:
  test-build-deploy-app:
    jobs:
      - test-app
      - build-and-deploy-app:
          requires:
            - test-app
          filters:
            branches:
              only:
                - main
